name: Keep Streamlit app awake
on:
  schedule:
    - cron: '17 */4 * * *'   # every 4 hours (Streamlit Community Cloud sleeps after ~12 h without visits)
  workflow_dispatch:
  push:
    paths: ['.github/workflows/keep-awake.yml', '.github/scripts/keep_awake.py']
permissions:
  contents: read
jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python .github/scripts/keep_awake.py
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-awake-failure
          path: keep_awake_failure.png
          if-no-files-found: ignore
